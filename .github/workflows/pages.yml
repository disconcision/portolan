# Publishes site/ (the notebook front page, the living notes, the studies) to GitHub Pages on every push to main.
# It shows up at https://andrewblinn.com/portolan/ because the user site has that custom domain.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The notebook, plus the page itself under app/ so recorded runs in site/runs/ can be replayed
      # in the browser (app/?trace=../runs/<name>.jsonl) with no sidecar.
      - name: Assemble the site
        run: mkdir _site && cp -R site/. _site/ && cp -R web _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
