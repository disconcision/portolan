<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portolan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="canvas/canvas.css">
<link rel="stylesheet" href="style.css">
<script>
// Theme and corner style: from the address (?theme=dark, ?corners=round), else what was last chosen.
// Square bar tabs are the default.
(function () {
  var q = new URLSearchParams(location.search), get = function (k) { try { return localStorage.getItem('portolan.' + k); } catch (e) { return null; } };
  var theme = q.get('theme') || get('theme') || 'light', corners = q.get('corners') || get('corners') || 'square';
  if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
  document.documentElement.dataset.corners = corners === 'round' ? 'round' : 'square';
})();
</script>
</head>
<body>
<div id="page">
  <div id="top-bar">
    <div id="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><g stroke="currentColor" stroke-width="1" fill="none"><circle cx="12" cy="12" r="7"/><path d="M12 1v22M1 12h22M4.2 4.2l15.6 15.6M19.8 4.2L4.2 19.8"/></g><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg>
    </div>
    <div id="title">portolan</div>
    <div id="editor-mode"><span>/</span><span id="project">…</span>
      <span id="module-wrap" hidden><span>/</span><select id="module" aria-label="Module shown on the canvas" title="The module the canvas is drawing"></select></span>
      <span id="mode"></span></div>
    <div class="spacer"></div>
    <div id="top-right">
      <button id="lang" title="Show code and types in OCaml or Reason syntax"></button>
      <button id="corners" title="Switch the bar tabs between rounded and square"></button>
      <button id="theme" title="Switch between light and dark"></button>
      <a href="trace" target="_blank" rel="noopener">trace</a>
    </div>
  </div>

  <div id="main">
    <div id="canvas-pane">
      <div class="canvas-header">
        <span class="canvas-title">Chart</span>
        <div class="canvas-toolbar">
          <button class="canvas-tool-btn tool-active" id="pace" title="Play each change as a paced score">pace</button>
          <button class="canvas-tool-btn tool-active" id="follow" title="The camera follows the agent">follow</button>
          <button class="canvas-tool-btn" id="fit" title="Frame the whole graph">fit</button>
          <span class="toolbar-spacer"></span>
          <button class="canvas-tool-btn" id="which" hidden></button>
        </div>
      </div>
      <div id="canvas-host"><div id="canvas"></div><div id="flux" hidden></div></div>
      <section id="info">
        <div id="info-head"><span id="info-path">Pick a function or type on the canvas to see its definition.</span><span id="info-type"></span>
</div>
        <pre id="info-code"></pre>
      </section>
    </div>

    <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize the chat pane" tabindex="0"></div>
    <aside id="sidebar">
      <div id="feed" aria-live="polite"></div>
      <form id="ask">
        <div id="ask-bar">
          <span id="about" hidden>about <code id="about-name"></code><button type="button" id="about-drop" title="Send the message without the selection" aria-label="Remove the selection from the message">×</button></span>
          <span class="spacer"></span>
          <button type="button" id="new" title="Start a new conversation. This one is kept in the project's .portolan/conversations folder.">new</button>
          <button type="button" id="stop" title="Stop the agent's turn">stop</button>
        </div>
        <textarea id="prompt" rows="3" placeholder="Message the agent. Enter sends, Shift+Enter makes a new line."></textarea>
        <button type="submit" id="send" title="Send" aria-label="Send">↑</button>
      </form>
    </aside>
  </div>

  <div id="bottom-bar">
    <span class="lead">RUN</span>
    <span class="cell" id="build">no build yet</span>
    <span class="cell" id="tests"></span>
    <span class="spacer"></span>
    <span class="cell tail" id="agent">agent: idle</span>
  </div>
</div>
<script src="view.js"></script>
<script src="canvas/portolan_canvas.js"></script>
<script src="app.js"></script>
</body>
</html>
